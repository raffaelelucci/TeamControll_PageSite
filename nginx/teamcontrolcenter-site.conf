server {
    listen 80;
    server_name www.teamcontrolcenter.it;
    return 301 https://teamcontrolcenter.it$request_uri;
}

server {
    listen 80;
    server_name teamcontrolcenter.it;

    # Necessario per il form Contattaci con allegati opzionali.
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8088/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8088/sitemap.xml;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
