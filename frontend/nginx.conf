server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location = /robots.txt { try_files /robots.txt =404; add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { try_files /sitemap.xml =404; add_header Cache-Control "public, max-age=3600"; }
  location = /security.txt { try_files /security.txt =404; add_header Cache-Control "public, max-age=3600"; }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
